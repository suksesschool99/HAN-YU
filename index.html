<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Han Yu - Belajar Bahasa Mandarin Han Yu 1 - 12</title>
  <meta name="description" content="Website pembelajaran interaktif Bahasa Mandarin Han Yu 1 sampai Han Yu 12 bertema petualangan Dinosaurus. Dilengkapi panduan cara membaca, cara menulis goresan Hanzi, dan game mencocokkan kata dengan gambar.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/dino/rexy.jpg" type="image/jpeg">
</head>
<body>

  <!-- HEADER SITUS -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand-logo-wrap" onclick="window.dinoApp.setActiveNavTab('reading'); return false;">
        <img src="assets/dino/rexy.jpg" alt="Dino Paleontolog Rexy" onerror="this.src='assets/dino/egg.jpg'">
        <div class="brand-title-group">
          <h1>🦖 Dino Han Yu <span>(汉语)</span></h1>
          <p>Petualangan Belajar Mandarin Buku 1 - 12</p>
        </div>
      </a>

      <div class="header-stats-group">
        <button class="tone-guide-btn" id="toneGuideBtn" title="Panduan 4 Nada Suara Mandarin">
          🎵 Panduan 4 Nada (声调)
        </button>
        <div class="stat-pill" title="Total Bintang yang Diraih">
          <span>⭐</span>
          <span id="totalStarsCount">0</span>
        </div>
        <div class="stat-pill egg-pill" title="Telur Dino yang Telah Menetas">
          <span>🥚</span>
          <span id="hatchedEggsCount">0</span> Menetas
        </div>
      </div>
    </div>
  </header>

  <!-- PEMILIH BUKU LEVEL HAN YU 1 - 12 -->
  <section class="book-selector-section" aria-label="Pemilih Buku Han Yu">
    <div class="book-selector-container">
      <span class="selector-label">📚 Pilih Level Buku:</span>
      <div class="book-scroll-wrapper" id="bookListGrid">
        <!-- Akan dirender dinamis oleh js/app.js (Han Yu 1 sampai 12) -->
      </div>
    </div>
  </section>

  <!-- TAB NAVIGASI UTAMA (3 FITUR UTAMA + MUSEUM FOSIL) -->
  <nav class="main-nav-bar" aria-label="Navigasi Fitur Utama">
    <div class="nav-tabs-container">
      <button class="main-nav-btn active" data-tab="reading">
        <span>🔊</span> 1. Cara Membaca & Audio
      </button>
      <button class="main-nav-btn" data-tab="writing">
        <span>✍️</span> 2. Cara Menulis Goresan
      </button>
      <button class="main-nav-btn" data-tab="matching">
        <span>🎮</span> 3. Mencocokkan Kata & Gambar
      </button>
      <button class="main-nav-btn" data-tab="museum">
        <span>🏛️</span> 4. Museum Fosil & Lencana
      </button>
    </div>
  </nav>

  <!-- SUB-BAR NAVIGASI UNIT PEMBELAJARAN -->
  <section class="unit-nav-bar" aria-label="Pemilih Unit Pembelajaran">
    <div class="unit-nav-container" id="unitTabsContainer">
      <!-- Akan dirender dinamis berdasarkan buku yang dipilih -->
    </div>
  </section>

  <!-- AREA KONTEN UTAMA APLIKASI -->
  <main class="app-main-layout">
    <div id="mainContentArea">
      <!-- Konten dinamis akan dimuat oleh js/app.js -->
    </div>
  </main>

  <!-- MODAL PENETASAN TELUR DINO & PANDUAN NADA -->
  <div id="eggModal" class="modal-overlay" style="display: none;"></div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>🦕 <strong>Dino Han Yu Explorer</strong> &copy; 2026. Berdasarkan Kurikulum Standar Buku Teks <em>《汉语》 1 - 12</em>.</p>
  </footer>

  <!-- SCRIPT LOGIKA APLIKASI -->
  <script src="js/curriculum-data.js"></script>
  <script src="js/audio-speech.js"></script>
  <script src="js/stroke-engine.js"></script>
  <script src="js/matching-game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
